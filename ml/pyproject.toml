[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pebble"
version = "0.1.0"
description = "A 120M parameter Mamba-2 SLM built from scratch"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.24.0",
    "tokenizers>=0.19.0",
    "datasets>=2.18.0",
    "wandb>=0.16.0",
    "polars>=0.20.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
export = ["onnx>=1.15.0", "onnxruntime>=1.17.0"]
dev = ["pytest", "black", "ruff"]

[tool.setuptools.packages.find]
include = ["pebble*"]
